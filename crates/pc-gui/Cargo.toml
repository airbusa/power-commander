[package]
name = "pc-gui"
description = "PowerCommander's desktop window"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "powercommander"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.7.3"
# Rendered PDF pages become GPUI images; GPUI builds it already.
image = { version = "0.25", default-features = false }
# Server prompts reach the window by a channel; GPUI builds it already.
futures = "0.3"
pc-core.workspace = true

[package]
name = "pc-gui"
description = "PowerCommander's desktop window"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "powercommander"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.7.3"
# Rendered PDF pages become GPUI images; GPUI builds it already.
image = { version = "0.25", default-features = false }
# Server prompts reach the window by a channel; GPUI builds it already.
futures = "0.3"
pc-core.workspace = true

# The name on macOS's menu bar when run without a bundle; GPUI builds them already.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSDictionary", "NSObject", "NSString"] }

[package]
name = "pc-gui"
description = "PowerCommander's desktop window"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "powercommander"
path = "src/main.rs"

[dependencies]
# Colours for the editor: every language GPUI Kit highlights.
gpui-kit = { version = "0.7.3", features = ["tree-sitter-languages"] }
# And XML's, which GPUI Kit lacks: its grammar, for GPUI Kit's tree-sitter.
tree-sitter = "0.26"
tree-sitter-xml = "0.7"
# Rendered PDF pages become GPUI images; GPUI builds it already.
image = { version = "0.25", default-features = false, features = ["png"] }
# Server prompts reach the window by a channel; GPUI builds it already.
futures = "0.3"
pc-core.workspace = true

# The name on macOS's menu bar when run without a bundle, applications' own
# icons; GPUI builds them already.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSDictionary", "NSGeometry", "NSObject", "NSError", "NSRange", "NSString", "NSURL", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSAppearance", "NSApplication", "NSBezierPath", "NSBitmapImageRep", "NSColor", "NSColorSpace", "NSControl", "NSEvent", "NSFont", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSPasteboard", "NSPopover", "NSResponder", "NSSharingService", "NSText", "NSTextField", "NSTokenField", "NSTrackingArea", "NSView", "NSViewController", "NSWindow", "NSWorkspace"] }

# The .exe's icon on Windows, which GPUI gives its windows (resource 1).
[build-dependencies]
winresource = "0.1.34"

# The window's HWND, which owns Explorer's context menu on Windows; GPUI builds it already.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

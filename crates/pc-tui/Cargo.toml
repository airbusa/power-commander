[package]
name = "pc-tui"
description = "PowerCommander in the terminal"
version.workspace = true
edition.workspace = true
license.workspace = true

# The command is short to type, as Midnight Commander's `mc`.
[[bin]]
name = "pc"
path = "src/main.rs"

[dependencies]
pc-core.workspace = true
ratatui = "0.30"
# Pictures and PDF pages: Sixel, kitty or iTerm2 images, else half blocks; no chafa.
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm", "image-defaults"] }
# Decodes pictures; ratatui-image builds it already.
image = { version = "0.25", default-features = false }
# Column widths of names; ratatui builds it already.
unicode-width = "0.2"

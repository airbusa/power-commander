[package]
name = "pc-core"
description = "PowerCommander's engine, shared by the GUI and the CLI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Modification times in local time.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The configuration folder of each platform.
dirs = "6"
# Code pages of the viewer; GPUI builds it already.
encoding_rs = "0.8"
# Finds the line ends of big files fast.
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# F8 moves to the trash, as each platform keeps one.
trash = "5.3.0"

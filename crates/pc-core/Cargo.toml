[package]
name = "pc-core"
description = "PowerCommander's engine, shared by the GUI and the CLI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Checksum files: SFV and MD5; ring has the SHAs.
crc32fast = "1"
md-5 = "0.10"
# Compare By Content's line diff; GPUI Kit builds it already.
similar = "2"
# Modification times in local time.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The configuration folder of each platform.
dirs = "6"
# Code pages of the viewer; GPUI builds it already.
encoding_rs = "0.8"
# Finds the line ends of big files fast.
memchr = "2"
# Saved server passwords: KWallet or GNOME Keyring, macOS Keychain, Windows Credential Manager.
keyring = "4"
# PDF pages for the viewer, by the bundled PDFium (vendor/pdfium).
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_8125", "thread_safe"] }
# The viewer's Find; GPUI builds it already.
regex = "1"
# SFTP in pure Rust: ring, as GPUI has it, rather than a C crypto build.
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-config = "0.58"
russh-sftp = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Runs the SSH connections; GPUI builds it already.
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync"] }
# F8 moves to the trash, as each platform keeps one.
trash = "5.3.0"
suppaftp = { version = "12", default-features = false, features = ["rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"

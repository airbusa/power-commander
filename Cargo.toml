[workspace]
resolver = "3"
members = ["crates/pc-core", "crates/pc-gui"]
# Patched third-party crates are not workspace members (no tests or lints run).
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
pc-core = { path = "crates/pc-core" }

# GPUI Kit with Water Data Studio's patches (menu bar not scrolling, ...); see vendor/README.md.
[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
gpui-base = { path = "vendor/gpui-base" }

[profile.release]
strip = true
